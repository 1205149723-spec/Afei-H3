[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "afei-h3-jupyter-launcher"
version = "0.2.0"
description = "Protected Jupyter gateway and launcher for Afei H3"
requires-python = ">=3.10"

[project.entry-points."jupyter_serverproxy_servers"]
afei-h3 = "afei_h3_proxy:setup_afei_h3"

[tool.setuptools]
py-modules = ["afei_h3_proxy"]
